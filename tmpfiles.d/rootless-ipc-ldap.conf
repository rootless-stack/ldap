# /etc/tmpfiles.d/rootless-ipc-ldap.conf
# lldap's socket directories.  ldap-relay binds ldap/ldap.sock and
# http/http.sock as ldap-svc; the directory ACLs are the only gate.
#
# Type Path                          Mode User     Group    Age Argument
d      /run/rootless-ipc/lldap       0750 ldap-svc ldap-svc -   -
d      /run/rootless-ipc/lldap/ldap  0750 ldap-svc ldap-svc -   -
d      /run/rootless-ipc/lldap/http  0750 ldap-svc ldap-svc -   -

# No ACL lines here: each consumer stack appends its own grants (a+) in
# its own tmpfiles file, e.g. mail/tmpfiles.d.  A consumer needs traversal
# (rx) on this directory and on the scope it uses: ldap/ for LDAP, http/
# for the web UI and admin API.
