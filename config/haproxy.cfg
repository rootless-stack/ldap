# ldap-relay: lldap's only way in from outside the stack.  lldap listens on
# TCP alone; this relays both ports to Unix sockets under
# /run/rootless-ipc/lldap/<scope>/, and each scope directory's ACL decides
# which host users may connect (tmpfiles.d/rootless-ipc-ldap.conf).
# Plain TCP pass-through: clients bind and authenticate against lldap.
global
    # The image default derives maxconn from the fd limit (~262k).
    maxconn 1024
    log stderr format short local0 warning

defaults
    mode tcp
    log global
    option dontlognull
    timeout connect 5s
    # LDAP clients such as Postfix and Dovecot hold idle connections open
    # and reconnect when one is closed.
    timeout client 1d
    timeout server 1d

# lldap gets a new address whenever its container is recreated: re-resolve
# through the network's DNS instead of pinning the start-up answer.
resolvers podman
    parse-resolv-conf
    hold valid 10s

# Mode 666: the directory ACL is the gate, not the socket file.
listen ldap
    bind unix@/run/rootless-ipc/lldap/ldap/ldap.sock mode 666
    server lldap lldap:3890 resolvers podman init-addr last,libc,none

# Web UI and GraphQL admin API.
listen http
    bind unix@/run/rootless-ipc/lldap/http/http.sock mode 666
    server lldap lldap:17170 resolvers podman init-addr last,libc,none
